server {
    listen 80;
    server_name _;
    include /etc/nginx/chesso-app.conf;
}

# HTTPS, needed to install the app (PWA). The certificate comes from certs.sh.
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/chesso-app.conf;
}
