# Shared by the HTTP and HTTPS servers in default.conf.
root /usr/share/nginx/html;

# Static assets have hashed names, so they can be cached for good.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# The service worker and manifest must be revalidated, or clients keep an old app.
location = /sw.js {
    add_header Cache-Control "no-cache";
}
location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
}

# The local CA, for trusting the self-made HTTPS certificate on phones and laptops.
location = /ca.crt {
    default_type application/x-x509-ca-cert;
    add_header Content-Disposition 'attachment; filename="chess-o-ca.crt"';
}

location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Analysis progress and coach tokens are Server-Sent Events: no buffering, long reads.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding on;
}

location / {
    try_files $uri /index.html;
}
